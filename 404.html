
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d18">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #080d18;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }

    main { max-width: 600px; }

    .brand {
      color: #60a5fa;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .code {
      margin: 30px 0 10px;
      color: #60a5fa;
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -6px;
    }

    h1 {
      margin: 20px 0 12px;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
    }

    p {
      color: #a7b2c5;
      line-height: 1.8;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s ease;
    }

    a.primary {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
    }

    a:hover { transform: translateY(-2px); }

    footer {
      margin-top: 48px;
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <a href="https://imranlateef.me/">
    <div class="brand">IMRANLATEEF<span aria-hidden="true">.ME</span></div>
    </a>
    <div class="code">404</div>

    <h1>Oops! You've taken a wrong turn.</h1>

    <p>
      The page you're looking for doesn't exist, may have moved,
      or the link may be incorrect.
    </p>

    <p>No worries — let's get you back on track.</p>

    <div class="actions">
      <a class="primary" href="https://imranlateef.me/">
        ← Back to Homepage
      </a>
      <a href="https://www.linkedin.com/in/imranlateefunar/">
        Connect with me
      </a>
    </div>

    <footer>
      © <span id="year"></span> Imran Lateef · Built with purpose.
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
