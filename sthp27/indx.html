done=1;clearInterval(iv);const sc=[0,0,0];ans.forEach((a,i)=>{if(a==Q[i].a)sc[T[i].s]++});const tot=sc[0]+sc[1]+sc[2];
rec={timestamp:new Date().toISOString(),test:CFG.testId,name:U.name.trim(),english:sc[0],math:sc[1],iq:sc[2],total:tot,percent:tot,seconds:Math.min(CFG.minutes*60,Math.round(CFG.minutes*60-(end-Date.now())/1000)),answers:ans.map(a=>a<0?"-":"abcd"[a]).join("")};
res();save()}

async function save(){
  const st=$("#st");
  if(st)st.textContent="Recording your anonymized result…";
  try{
    const response=await fetch(CFG.apiBase+"/api/results",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        testId:CFG.testId,
        result:{
          english:rec.english,math:rec.math,iq:rec.iq,total:rec.total,
          percent:rec.percent,seconds:rec.seconds
        }
      })
    });
    if(!response.ok)throw new Error("The result service did not accept the submission.");
    const data=await response.json();
    if(!data.candidateId)throw new Error("The server did not return a candidate ID.");
    rec.candidateId=data.candidateId;
    rec.storageStatus="saved";
    const idBox=$("#candidateId");
    if(idBox)idBox.textContent=rec.candidateId;
    if(st)st.innerHTML='<span class="result-note">Your score has been recorded in the online results file. Keep your candidate ID to retrieve your result later.</span>';
    ALL=null;
    await load();
  }catch(err){
    rec.storageStatus="failed";
    if(st)st.innerHTML='<span class="result-warning">Your score has been calculated, but online recording could not be confirmed. The results service must be deployed and connected before results can be stored.</span>';
    ALL=[rec];
    tab(tabk);
  }
}
function parse(t){const r=[];let row=[],c="",q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}else if(ch=='"')q=1;else if(ch==","){row.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;row.push(c);c="";if(row.length>1)r.push(row);row=[]}else c+=ch}
if(c||row.length){row.push(c);if(row.length>1)r.push(row)}const h=r.shift()||[];return r.map(x=>Object.fromEntries(h.map((k,j)=>[k,x[j]])))}
async function getAll(){
  try{
    const r=await fetch(CFG.apiBase+"/leaderboard?testId="+encodeURIComponent(CFG.testId),{headers:{"Accept":"application/json"}});
    if(!r.ok)return [];
    const data=await r.json();
    return Array.isArray(data.results)?data.results:[];
  }catch(e){return []}
}
async function load(){
  const rows=await getAll();
  ALL=rows.filter(r=>r.testId===CFG.testId || r.test===CFG.testId);
  if(rec && rec.storageStatus==="saved" && !ALL.some(r=>r.resultId===rec.resultId))ALL.push(rec);
  tab(tabk);
}
function showRetrieve(){
  const box=$("#retrieveBox");if(!box)return;
  box.innerHTML=`<div class="card"><h3>Retrieve a previous result</h3>
  <label class=f>Candidate ID<input id=retId maxlength=40 placeholder="Enter your candidate ID"></label>
  <button type=button class=sub onclick="retrieveResult()">Retrieve result</button>
  <p class=st id=retStatus></p></div>`;
}
async function retrieveResult(){
  const id=$("#retId")?.value.trim(),status=$("#retStatus");
  if(!id){if(status)status.textContent="Enter your candidate ID.";return}
  try{
    const r=await fetch(CFG.apiBase+"/api/result?candidateId="+encodeURIComponent(id));
    if(!r.ok)throw new Error();
    const data=await r.json();
    if(!data.result)throw new Error();
    rec={...data.result,name:"Candidate "+data.result.candidateId,answers:null,storageStatus:"saved"};
    ALL=await getAll();
    res();
  }catch(e){if(status)status.textContent="No saved result was found for that candidate ID, or the result service is not available."}
}
async function getAll(){
  try{
    const r=await fetch(CFG.apiBase+"/api/leaderboard?testId="+encodeURIComponent(CFG.testId));
    if(!r.ok)return [];
    const data=await r.json();
    return Array.isArray(data.results)?data.results:[];
  }catch(e){return []}
}
async function load(){
  ALL=await getAll();
  if(rec && rec.storageStatus==="saved" && rec.candidateId && !ALL.some(r=>r.candidateId===rec.candidateId))ALL.push(rec);
  tab(tabk);
}
function res(){m.innerHTML=`<div class=card><h2>Result – ${esc(rec.name)}</h2><div class=big>${rec.total}/100</div>
<div class=sc><div>English<br><b>${rec.english}/40</b></div><div>Mathematics<br><b>${rec.math}/40</b></div><div>IQ<br><b>${rec.iq}/20</b></div></div>
<p class=st>Time used: ${mmss(rec.seconds)} · Unanswered: ${rec.answers?rec.answers.split("-").length-1:"Not available for retrieved records"}</p><p class=st>Each correct answer earns 1 mark. There is no negative marking.</p><p class=st>Candidate ID: <b id=candidateId>${rec.candidateId||"Being generated…"}</b></p><p class=st id=st>Checking online result storage…</p></div>
<div class=tabs>${["Review","Analytics","Leaderboard"].map((x,i)=>`<button id=t${i} onclick="tab(${i})">${x}</button>`).join("")}</div><div id=tb></div>`;tab(0)}
function tab(k){tabk=k;[0,1,2].forEach(i=>{const b=$("#t"+i);if(b)b.classList.toggle("on",i==k)});const e=$("#tb");if(!e)return;e.innerHTML=k==0?rev():ALL?(k==1?ana():lb()):"<div class=card>Loading…</div>"}
const ao=(i,a)=>a<0?"— (not answered)":L[a]+". "+Q[i].o[a];
function rev(){const a=rec.answers;if(!a)return`<div class=card><h3>Answer review</h3><p class=st>Detailed answer review is available immediately after completing the test. The public results file stores anonymized scores only.</p></div>`;return`<div class=card><h3>Answer review</h3><p class=st>Review every question, your selected answer and the correct answer. Green indicates correct, red indicates incorrect, and gold indicates unanswered.</p>${Q.map((q,i)=>{const c=a[i]=="-"?-1:"abcd".indexOf(a[i]);return`<div class="rv ${c<0?"sk":c==q.a?"ok":"no"}"><b>${i+1}.</b> ${fmt(q.q)}<br>Your answer: ${esc(ao(i,c))}${c==q.a?" ✔":"<br>Correct answer: "+esc(ao(i,q.a))}</div>`}).join("")}</div>`}
const bar=(l,p,x,c)=>`<div class=r><span>${l}</span><div class=b><u class="${c||""}" style="width:${Math.max(0,Math.min(100,p))}%"></u></div><em>${x}</em></div>`;
function ana(){
  const R=ALL||[rec],n=R.length,av=k=>R.reduce((s,r)=>s+(+r[k]||0),0)/n;
  const tot=R.map(r=>+r.total||0),rank=1+tot.filter(x=>x>rec.total).length;
  const pc=Math.round(100*tot.filter(x=>x<rec.total).length/n);
  const bins=Array(10).fill(0);tot.forEach(x=>bins[Math.min(9,Math.floor(x/10))]++);
  const mb=Math.max(1,...bins),my=Math.min(9,Math.floor(rec.total/10));
  return`<div class=card><h3>Overall (${n} recorded participant${n>1?"s":""})</h3><p>Rank <b>#${rank}</b> · Better than <b>${pc}%</b> · Class average <b>${av("total").toFixed(1)}</b> · Highest <b>${Math.max(...tot)}</b></p>
  ${[["English","english",40],["Mathematics","math",40],["IQ","iq",20]].map(([l,k,mx])=>bar(l+" (you)",100*(+rec[k]||0)/mx,(+rec[k]||0)+"/"+mx)+bar(l+" (average)",100*av(k)/mx,av(k).toFixed(1)+"/"+mx,"a")).join("")}</div>
  <div class=card><h3>Score distribution</h3><div class=hist>${bins.map((b,i)=>`<div class="${i==my?"me":""}" style="height:${100*b/mb}%" title="${b} participant(s)"></div>`).join("")}</div><div class=hl>${bins.map((b,i)=>`<span>${i*10}<br>${b}</span>`).join("")}</div><p class=st>Gold bar = your score band. Numbers under each bar = participants in that band.</p></div>
  <div class=card><p class=st>Class analytics are based on anonymized totals and section scores stored in results.csv.</p></div>`;
}
function lb(){const S=[...ALL].sort((a,b)=>b.total-a.total||a.seconds-b.seconds),i=S.findIndex(r=>r.candidateId&&r.candidateId===rec.candidateId);
return`<div class=card><h3>🏆 Leaderboard (${S.length} participant${S.length>1?"s":""})</h3><p class=st>Your rank: <b>#${i+1}</b></p><div style="overflow-x:auto"><table><tr><th>#<th>Candidate ID<th>Eng<th>Math<th>IQ<th>Total<th>Time</tr>
${S.slice(0,25).map((r,j)=>`<tr class="${j==i?"me":""}"><td>${j+1}<td>${esc(String(r.candidateId||"—"))}<td>${r.english}<td>${r.math}<td>${r.iq}<td><b>${r.total}</b><td>${mmss(+r.seconds)}</tr>`).join("")}</table></div>
${i>24?`<p class=st>…you are ranked #${i+1}</p>`:""}<p><button onclick="ALL=null;tab(2);load()">Refresh</button></p></div>`}
reg();
</script></body></html>
