    <div class=card><h3>Test schedule</h3><p class=tz>All times are Pakistan Standard Time (PKT). Tests unlock automatically at the time shown.</p>
    ${[1,2,3,4,5].map(n=>{const o=isOpen(n);return `<div class=mk-row><div><h3>Mock Test ${n}<span class="badge ${o?"live":"lock"}">${o?"LIVE":"LOCKED"}</span></h3><div class=sm>${SCHED[n].label}${o?"":` · opens in <span class=cd>${cd(opensAt(n)-now())}</span>`}</div></div>${o?`<a class="btn go" href="?mock=${n}">Attempt now</a>`:`<a class="btn off" aria-disabled="true">🔒 Locked</a>`}</div>`}).join("")}</div>`;
  };
  draw();hv=setInterval(draw,1000);
}

function lockedScreen(){
  const draw=()=>{
    if(isOpen(M)){clearInterval(hv);hv=null;reg();return}
    $("#m").innerHTML=`<div class="card lockbox"><div class=ic>🔒</div><h2>Mock Test ${M} is locked</h2>
    <p>This test goes live on<br><b>${SCHED[M].label}</b></p><span class=cd>${cd(opensAt(M)-now())}</span>
    <p class=st>The page will unlock automatically when the time arrives.</p><p><a class=btn href="./">View full schedule</a></p></div>`;
  };
  draw();hv=setInterval(draw,1000);
}

/* ---------- registration ---------- */
function reg(){
  stopTimers();
  const saved=(()=>{try{return JSON.parse(ls.get(KEY())||"null")}catch(e){return null}})();
  const canResume=saved&&saved.U&&Array.isArray(saved.ans)&&saved.ans.length===100&&saved.end;
  $("#m").innerHTML=`<div class=card><h2>STHP &amp; Foundation – Mock Test ${M}</h2>
  <p>Sukkur IBA University · Sindh Talent Hunt Program pattern<br>Part I English (40) · Part II Mathematics (40) · Part III IQ (20)<br><b>100 marks · ${CFG.minutes} minutes · 1 mark each · no negative marking</b></p>
  ${canResume?`<div class=result-warning>You have an unfinished attempt of this test${saved.end<=now()?" (its time has ended)":""}. <button type=button class=sub onclick="resume()">${saved.end<=now()?"Submit my saved answers":"Resume my attempt"}</button></div>`:""}
  <form id=f><label class=f>Full name<input name=name required maxlength=60 autocomplete=name></label>
  <label class=f>Gender<select name=gender required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></label>
  <label class=f>Last qualification<select name=qualification required><option value="">Select</option><option>Matric / SSC</option><option>O-Level</option><option>Intermediate / HSSC</option><option>A-Level</option><option>Other</option></select></label>
  <p class=st>${apiOn()?"Your anonymized score (candidate ID and marks only) will be recorded in the public mock-test results file. Your name and email are not written to that file.":"Your result will be shown to you at the end of the test."} The timer starts when you press Start and the test submits automatically when time is up. Do not close the page during the test.</p>
  ${apiOn()?`<p class=st>By continuing, you understand that your candidate ID and scores will be visible in the public results file. Do not enter sensitive personal information.</p>`:""}
  <button class=sub>Start Test</button></form><p class=st><a href="./">← Back to schedule</a></p>
  ${apiOn()?`<p class=st><button type=button onclick="showRetrieve()">Retrieve a previous result</button></p><div id=retrieveBox></div>`:""}</div>`;
  $("#f").onsubmit=e=>{e.preventDefault();U=Object.fromEntries(new FormData(e.target));start()};
}

function begin(){
  done=0;onbeforeunload=e=>{if(!done){e.preventDefault();return e.returnValue=""}};
  iv=setInterval(tick,1000);show();
}
function start(){ans=Array(100).fill(-1);mark=[];cur=0;end=now()+CFG.minutes*60000;persist();begin()}
function resume(){
  let s;try{s=JSON.parse(ls.get(KEY()))}catch(e){return}
  if(!s)return;U=s.U;ans=s.ans;mark=s.mark||[];cur=Math.min(99,Math.max(0,+s.cur||0));end=s.end;begin();
}
function tick(){
  const r=Math.max(0,Math.round((end-now())/1000)),e=$("#tm");
  if(e){e.textContent=String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0");e.className=r<300?"low":""}
  if(!r&&!done)fin(1);
}
function go(k){cur=k;persist();show();toggleDrawer(false);scrollTo(0,0)}
function setAns(i,k){ans[i]=k;persist();show()}
function toggleDrawer(open){const d=$("#questionDrawer"),b=$("#drawerBackdrop");if(!d||!b)return;d.classList.toggle("open",!!open);b.classList.toggle("open",!!open)}
function mk(i){mark[i]=!mark[i];persist();show()}

function show(){
  const i=cur,q=Q[i],t=T[i];
  m.innerHTML=`<div class=bar><span>${SEC[t.s].n} · ${t.t} · Q${i+1}/100</span><b id=tm></b></div>
<div class=card><div class=qhead><p class=dir>${DIR[t.t]||"Choose the correct answer."}</p><button type=button class=drawer-toggle onclick="toggleDrawer(true)" aria-label="Open question navigation">☰ Questions</button></div>${i<8?`<div class=ps>${esc(PASSAGE)}</div>`:""}<p>${fmt(q.q)}</p>
${q.o.map((o,k)=>`<label class="opt${ans[i]==k?" sel":""}"><input type=radio name=o ${ans[i]==k?"checked":""} onchange="setAns(${i},${k})"><span>${L[k]}. ${fmt(o)}</span></label>`).join("")}
<div class=nav><button onclick="go(${i-1})" ${i?"":"disabled"}>◀ Prev</button><button onclick="mk(${i})">${mark[i]?"Unmark":"Mark"} ★</button><button onclick="go(${i+1})" ${i<99?"":"disabled"}>Next ▶</button></div></div>
<div class=card><p class=st>Use the Questions button to open the navigation panel. You can move between all 100 questions at any time.</p><button class=sub onclick="fin(0)">Submit Test</button></div>
<div id=drawerBackdrop class="drawer-backdrop" onclick="toggleDrawer(false)"></div>
<aside id=questionDrawer class=drawer aria-label="Question navigation">
<div class=drawer-head><h3>Question Navigator</h3><button type=button onclick="toggleDrawer(false)" aria-label="Close question navigation">✕</button></div>
<p class=st>Answered: <b>${ans.filter(a=>a>=0).length}</b> / 100 · Marked: <b>${mark.filter(Boolean).length}</b></p>
<div class=pal>${Q.map((_,k)=>`<i role=button tabindex=0 aria-label="Go to question ${k+1}" class="${k==cur?"cur ":""}${ans[k]>=0?"ok ":""}${mark[k]?"mk":""}" onclick="go(${k})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();go(${k})}">${k+1}</i>`).join("")}</div>
<p class=drawer-legend>Green = answered · Grey = not attempted · Gold outline = marked for review · Blue border = current question</p>
<button class=sub onclick="toggleDrawer(false)">Close navigation</button>
</aside>`;tick();
}

/* ---------- finish ---------- */
function fin(auto){
  if(done)return;
  const un=ans.filter(a=>a<0).length;
  if(!auto&&!confirm(un?un+" question(s) unanswered. Submit now?":"Submit your test?"))return;
  done=1;clearInterval(iv);iv=null;ls.del(KEY());
  const sc=[0,0,0];ans.forEach((a,i)=>{if(a==Q[i].a)sc[T[i].s]++});const tot=sc[0]+sc[1]+sc[2];
  const total=CFG.minutes*60;
  rec={timestamp:new Date().toISOString(),test:CFG.idPrefix+M,name:U.name.trim(),english:sc[0],math:sc[1],iq:sc[2],total:tot,percent:tot,
    seconds:Math.max(0,Math.min(total,Math.round(total-(end-now())/1000))),answers:ans.map(a=>a<0?"-":"abcd"[a]).join("")};
  res();save();
}
async function save(){
  const st=$("#st");
  if(!apiOn()){
    rec.storageStatus="local";ALL=[rec];
    if(st)st.innerHTML='<span class="result-warning">Your result is shown on this device only. The online leaderboard is not connected yet.</span>';
    tab(tabk);return;
  }
  if(st)st.textContent="Recording your anonymized result…";
  try{
    const response=await fetch(CFG.apiBase+"/api/results",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({testId:CFG.idPrefix+M,result:{english:rec.english,math:rec.math,iq:rec.iq,total:rec.total,percent:rec.percent,seconds:rec.seconds}})});
    if(!response.ok)throw new Error("The result service did not accept the submission.");
    const data=await response.json();
    if(!data.candidateId)throw new Error("The server did not return a candidate ID.");
    rec.candidateId=data.candidateId;rec.storageStatus="saved";
    const idBox=$("#candidateId");if(idBox)idBox.textContent=rec.candidateId;
    const st2=$("#st");if(st2)st2.innerHTML='<span class="result-note">Your score has been recorded in the online results file. Keep your candidate ID to retrieve your result later.</span>';
    ALL=null;await load();
  }catch(err){
    rec.storageStatus="failed";
    const st2=$("#st");if(st2)st2.innerHTML='<span class="result-warning">Your score has been calculated, but online recording could not be confirmed. Please take a screenshot of this result.</span>';
    ALL=[rec];tab(tabk);
  }
}
async function getAll(){
  if(!apiOn())return [];
  try{
    const r=await fetch(CFG.apiBase+"/api/leaderboard?testId="+encodeURIComponent(CFG.idPrefix+M));
    if(!r.ok)return [];
    const data=await r.json();
    return Array.isArray(data.results)?data.results:[];
  }catch(e){return []}
}
async function load(){
  ALL=await getAll();
  if(rec&&rec.storageStatus==="saved"&&rec.candidateId&&!ALL.some(r=>r.candidateId===rec.candidateId))ALL.push(rec);
  if(!ALL.length&&rec)ALL=[rec];
  tab(tabk);
}
function showRetrieve(){
  const box=$("#retrieveBox");if(!box)return;
  box.innerHTML=`<div class="card"><h3>Retrieve a previous result</h3>
  <label class=f>Candidate ID<input id=retId maxlength=40 placeholder="Enter your candidate ID"></label>
  <button type=button class=sub onclick="retrieveResult()">Retrieve result</button><p class=st id=retStatus></p></div>`;
}
async function retrieveResult(){
  const id=$("#retId")?.value.trim(),status=$("#retStatus");
  if(!id){if(status)status.textContent="Enter your candidate ID.";return}
  try{
    const r=await fetch(CFG.apiBase+"/api/result?candidateId="+encodeURIComponent(id));
    if(!r.ok)throw new Error();
    const data=await r.json();
    if(!data.result)throw new Error();
    rec={...data.result,name:"Candidate "+data.result.candidateId,answers:null,storageStatus:"saved"};
    ALL=await getAll();res();
  }catch(e){if(status)status.textContent="No saved result was found for that candidate ID, or the result service is not available."}
}

/* ---------- results ---------- */
function res(){
  m.innerHTML=`<div class=card><h2>Result – ${esc(rec.name)}</h2><p class=st>Mock Test ${M}</p><div class=big>${rec.total}/100</div>
<div class=sc><div>English<br><b>${rec.english}/40</b></div><div>Mathematics<br><b>${rec.math}/40</b></div><div>IQ<br><b>${rec.iq}/20</b></div></div>
<p class=st>Time used: ${mmss(+rec.seconds||0)} · Unanswered: ${rec.answers?rec.answers.split("-").length-1:"Not available for retrieved records"}</p><p class=st>Each correct answer earns 1 mark. There is no negative marking.</p><p class=st>Candidate ID: <b id=candidateId>${esc(rec.candidateId||(apiOn()?"Being generated…":"Not issued (offline)"))}</b></p><p class=st id=st>${apiOn()?"Checking online result storage…":""}</p><p><a class=btn href="./">← Back to schedule</a></p></div>
<div class=tabs>${["Review","Analytics","Leaderboard"].map((x,i)=>`<button id=t${i} onclick="tab(${i})">${x}</button>`).join("")}</div><div id=tb></div>`;tab(0);scrollTo(0,0);
}
function tab(k){tabk=k;[0,1,2].forEach(i=>{const b=$("#t"+i);if(b)b.classList.toggle("on",i==k)});const e=$("#tb");if(!e)return;e.innerHTML=k==0?rev():ALL?(k==1?ana():lb()):"<div class=card>Loading…</div>"}
const ao=(i,a)=>a<0?"— (not answered)":L[a]+". "+Q[i].o[a];
function rev(){
  const a=rec.answers;
  if(!a)return`<div class=card><h3>Answer review</h3><p class=st>Detailed answer review is available immediately after completing the test.</p></div>`;
  return`<div class=card><h3>Answer review</h3><p class=st>Review every question, your selected answer and the correct answer. Green indicates correct, red indicates incorrect, and gold indicates unanswered.</p>${Q.map((q,i)=>{const c=a[i]=="-"?-1:"abcd".indexOf(a[i]);return`<div class="rv ${c<0?"sk":c==q.a?"ok":"no"}"><b>${i+1}.</b> ${fmt(q.q)}<br>Your answer: ${fmt(ao(i,c))}${c==q.a?" ✔":"<br>Correct answer: "+fmt(ao(i,q.a))}</div>`}).join("")}</div>`;
}
const bar=(l,p,x,c)=>`<div class=r><span>${l}</span><div class=b><u class="${c||""}" style="width:${Math.max(0,Math.min(100,p))}%"></u></div><em>${x}</em></div>`;
function ana(){
  const R=ALL&&ALL.length?ALL:[rec],n=R.length,av=k=>R.reduce((s,r)=>s+(+r[k]||0),0)/n;
  const tot=R.map(r=>+r.total||0),rank=1+tot.filter(x=>x>rec.total).length;
  const pc=Math.round(100*tot.filter(x=>x<rec.total).length/n);
  const bins=Array(10).fill(0);tot.forEach(x=>bins[Math.min(9,Math.floor(x/10))]++);
  const mb=Math.max(1,...bins),my=Math.min(9,Math.floor(rec.total/10));
  return`<div class=card><h3>Overall (${n} recorded participant${n>1?"s":""})</h3><p>Rank <b>#${rank}</b> · Better than <b>${pc}%</b> · Average <b>${av("total").toFixed(1)}</b> · Highest <b>${Math.max(...tot)}</b></p>
  ${[["English","english",40],["Mathematics","math",40],["IQ","iq",20]].map(([l,k,mx])=>bar(l+" (you)",100*(+rec[k]||0)/mx,(+rec[k]||0)+"/"+mx)+bar(l+" (average)",100*av(k)/mx,av(k).toFixed(1)+"/"+mx,"a")).join("")}</div>
  <div class=card><h3>Score distribution</h3><div class=hist>${bins.map((b,i)=>`<div class="${i==my?"me":""}" style="height:${100*b/mb}%" title="${b} participant(s)"></div>`).join("")}</div><div class=hl>${bins.map((b,i)=>`<span>${i*10}<br>${b}</span>`).join("")}</div><p class=st>Gold bar = your score band. Numbers under each bar = participants in that band.</p></div>
  <div class=card><p class=st>${apiOn()?"Analytics are based on anonymized totals and section scores of recorded participants.":"Online analytics are not connected yet, so only your own score is shown."}</p></div>`;
}
function lb(){
  const S=[...(ALL&&ALL.length?ALL:[rec])].sort((a,b)=>(+b.total)-(+a.total)||(+a.seconds)-(+b.seconds)),
  i=S.findIndex(r=>r===rec||(r.candidateId&&r.candidateId===rec.candidateId));
  return`<div class=card><h3>🏆 Leaderboard (${S.length} participant${S.length>1?"s":""})</h3><p class=st>Your rank: <b>#${i+1}</b></p><div style="overflow-x:auto"><table><tr><th>#<th>Candidate ID<th>Eng<th>Math<th>IQ<th>Total<th>Time</tr>
${S.slice(0,25).map((r,j)=>`<tr class="${j==i?"me":""}"><td>${j+1}<td>${esc(String(r.candidateId||"—"))}<td>${esc(r.english)}<td>${esc(r.math)}<td>${esc(r.iq)}<td><b>${esc(r.total)}</b><td>${mmss(+r.seconds||0)}</tr>`).join("")}</table></div>
${i>24?`<p class=st>…you are ranked #${i+1}</p>`:""}${apiOn()?`<p><button onclick="ALL=null;tab(2);load()">Refresh</button></p>`:""}</div>`;
}

/* ---------- boot ---------- */
(async function boot(){
  const n=parseInt(new URLSearchParams(location.search).get("mock"),10);
  await syncTime();
  if(n>=1&&n<=5&&MOCKS[n]){
    M=n;Q=MOCKS[n].q.map(x=>({q:x[0],o:x[1],a:x[2]}));PASSAGE=MOCKS[n].p;
    document.title="Mock Test "+n+" | STHP & Foundation 2027 | EduCareerInfo";
    if(isOpen(n))reg();else lockedScreen();
  }else home();
})();
</script></body></html>
